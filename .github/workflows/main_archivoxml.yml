name: Deploy Static Site to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # <--- ESTO ES LO QUE FALTABA
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E56A4A4212AD48F19BA1329055D0EBC6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CB0451AF4F524BD6B9F252F723711FAE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD2661DB44E842E7AC74A2650B007DAD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ArchivoXML'
          slot-name: 'Production'
          package: '.'
